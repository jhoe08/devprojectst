<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Market Scoping Activity Confirmation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root {
            --ink: #2c3e50;
            --paper: #ffffff;
            --line: #d9dee3;
            --mute: #6b7c93;
            --accent: #0b6bcb;
            --bg: #f6f8fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Segoe UI, Arial, sans-serif;
            margin: 32px;
            background: var(--bg);
            color: var(--ink);
            line-height: 1.5;
        }

        header {
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 8px;
        }

        .subtitle {
            color: var(--mute);
            font-size: 0.95rem;
        }

        .card {
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin: 16px 0 8px;
        }

        label {
            font-weight: 600;
            font-size: 0.95rem;
        }

        input[type="text"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 0.95rem;
            background: #fff;
        }

        textarea {
            min-height: 84px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
            background: #fff;
        }

        th,
        td {
            border: 1px solid var(--line);
            padding: 12px;
            vertical-align: top;
            text-align: left;
            font-size: 0.95rem;
        }

        thead th {
            background: #f1f4f8;
            font-weight: 700;
        }

        .notes {
            margin-top: 18px;
            background: #f0f6ff;
            border: 1px solid #c9defa;
            border-left: 4px solid var(--accent);
            border-radius: 6px;
            padding: 12px 14px;
            font-size: 0.95rem;
        }

        .footer-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 18px;
        }

        .sig {
            border: 1px dashed var(--line);
            border-radius: 8px;
            padding: 12px;
            background: #fff;
        }

        .sig label {
            font-weight: 600;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            border: 1px solid var(--line);
            background: #fff;
            color: var(--ink);
            border-radius: 8px;
            padding: 10px 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border: 1px solid var(--accent);
        }

        .muted {
            color: var(--mute);
            font-size: 0.9rem;
        }

        @media print {
            body {
                background: #fff;
                margin: 0;
            }

            .btn,
            .actions {
                display: none !important;
            }

            .card,
            .notes,
            .sig {
                box-shadow: none;
            }
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="card-header">
            <div class="card-head-row card-tools-still-right">
                <h4 class="card-title">ORS / Payment Details</h4>
            </div>
        </div>
        <div class="card-body">
            <form id="paymentDetailsForm">
                <div class="row gx-3 gy-3">
                    <div class="col-md-3">
                        <div class="form-group form-group-default">
                            <label for="orsNumber">ORS #</label>
                            <input id="orsNumber" name="orsNumber" type="text" class="form-control"
                                value="<%= transactions?.orsNumber || '' %>">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group form-group-default">
                            <label for="payee">PAYEE</label>
                            <input id="payee" name="payee" type="text" class="form-control"
                                value="<%= transactions?.payee || '' %>">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group form-group-default">
                            <label for="pap">PAP</label>
                            <input id="pap" name="pap" type="text" class="form-control"
                                value="<%= transactions?.pap || '' %>">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group form-group-default">
                            <label for="objectCode">OBJECT</label>
                            <input id="objectCode" name="objectCode" type="text" class="form-control"
                                value="<%= transactions?.objectCode || '' %>">
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="form-group form-group-default">
                            <label for="dvNumber">DV #</label>
                            <input id="dvNumber" name="dvNumber" type="text" class="form-control"
                                value="<%= transactions?.dvNumber || '' %>">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group form-group-default">
                            <label for="bursNumber">BURS No.</label>
                            <input id="bursNumber" name="bursNumber" type="text" class="form-control"
                                value="<%= transactions?.bursNumber || '' %>">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group form-group-default">
                            <label for="orsAmount">AMOUNT</label>
                            <input id="orsAmount" name="orsAmount" type="number" step="0.01" class="form-control"
                                value="<%= transactions?.orsAmount || '' %>">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group form-group-default">
                            <label for="particulars">PARTICULARS</label>
                            <textarea id="particulars" name="particulars" class="form-control"
                                rows="1"><%= transactions?.particulars || '' %></textarea>
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="form-group form-group-default">
                            <label for="prNumber">PR No.</label>
                            <input id="prNumber" name="prNumber" type="text" class="form-control"
                                value="<%= transactions?.prNumber || '' %>">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group form-group-default">
                            <label for="poContractNumber">PO / CONTRACT No.</label>
                            <input id="poContractNumber" name="poContractNumber" type="text" class="form-control"
                                value="<%= transactions?.poContractNumber || '' %>">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group form-group-default">
                            <label for="processorIn">PROCESSOR IN</label>
                            <input id="processorIn" name="processorIn" type="text" class="form-control"
                                value="<%= transactions?.processorIn || '' %>">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group form-group-default">
                            <label for="processorOut">PROCESSOR OUT</label>
                            <input id="processorOut" name="processorOut" type="text" class="form-control"
                                value="<%= transactions?.processorOut || '' %>">
                        </div>
                    </div>

                    <div class="col-md-3">
                        <div class="form-group form-group-default">
                            <label for="processorStatus">PROCESSOR STATUS</label>
                            <input id="processorStatus" name="processorStatus" type="text" class="form-control"
                                value="<%= transactions?.processorStatus || '' %>">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group form-group-default">
                            <label for="accountantIn">ACCOUNTANT IN</label>
                            <input id="accountantIn" name="accountantIn" type="text" class="form-control"
                                value="<%= transactions?.accountantIn || '' %>">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group form-group-default">
                            <label for="accountantOut">ACCOUNTANT OUT</label>
                            <input id="accountantOut" name="accountantOut" type="text" class="form-control"
                                value="<%= transactions?.accountantOut || '' %>">
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group form-group-default">
                            <label for="accountantStatus">ACCOUNTANT STATUS</label>
                            <input id="accountantStatus" name="accountantStatus" type="text" class="form-control"
                                value="<%= transactions?.accountantStatus || '' %>">
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="form-group form-group-default">
                            <label for="forCompliance">FOR COMPLIANCE</label>
                            <input id="forCompliance" name="forCompliance" type="text" class="form-control"
                                value="<%= transactions?.forCompliance || '' %>">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group form-group-default">
                            <label for="tempPayeeFormatting">TEMP PAYEE FORMATTING</label>
                            <input id="tempPayeeFormatting" name="tempPayeeFormatting" type="text" class="form-control"
                                value="<%= transactions?.tempPayeeFormatting || '' %>">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group form-group-default">
                            <label for="forOk">FOR OK</label>
                            <input id="forOk" name="forOk" type="text" class="form-control"
                                value="<%= transactions?.forOk || '' %>">
                        </div>
                    </div>

                    <div class="col-md-4">
                        <div class="form-group form-group-default">
                            <label for="statusProcessor">STATUS PROCESSOR</label>
                            <input id="statusProcessor" name="statusProcessor" type="text" class="form-control"
                                value="<%= transactions?.statusProcessor || '' %>">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group form-group-default">
                            <label for="statusAccountant">STATUS ACCOUNTANT</label>
                            <input id="statusAccountant" name="statusAccountant" type="text" class="form-control"
                                value="<%= transactions?.statusAccountant || '' %>">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="form-group form-group-default">
                            <label for="processorAccountantStatus">PROCESSOR + ACCOUNTANT</label>
                            <input id="processorAccountantStatus" name="processorAccountantStatus" type="text"
                                class="form-control" value="<%= transactions?.processorAccountantStatus || '' %>">
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
