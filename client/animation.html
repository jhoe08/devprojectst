    const papSelect = document.getElementById("pap-class");
    const objSelect = document.getElementById("obj-desc");

    // Step 1: Group rows by PAP
    // Group by PAP
    const grouped = {};
    for (let i = 1; i < data.length; i++) {
        const row = data[i];
        const pap = row[1];
        const cls = row[2];
        const obj = `${row[3]} - ${row[4]}`;

        if (!pap || !cls) continue; // skip empty PAP/CLASS

        if (!grouped[pap]) grouped[pap] = [];
        grouped[pap].push({ class: cls, obj });
    }

    // Convert grouped object into array of [pap, entries]
    let groupedArray = Object.entries(grouped);

    // // Sort by PAP text (ignore numeric prefix)
    groupedArray.sort((a, b) => {
        const aText = a[0].split(" ").slice(1).join(" "); // "DOPPP"
        const bText = b[0].split(" ").slice(1).join(" "); // "GASS"
        return aText.localeCompare(bText);
    });

    // // If you want grouped back as an object (sorted keys)
    const sortedGrouped = {};
    groupedArray.forEach(([pap, entries]) => {
        sortedGrouped[pap] = entries;
    });

    // Sort each PAP’s entries by CLASS
    // Object.keys(grouped).forEach(pap => {

    // Populate PAP select (unique PAPs)
    Object.keys(sortedGrouped).forEach(pap => {
        const option = document.createElement("option");
        option.value = pap;
        option.textContent = pap;
        papSelect.appendChild(option);
    });

    // Update OBJ select when PAP changes
    papSelect.addEventListener("change", function() {
        const selectedPap = this.value;
        objSelect.innerHTML = "";

        grouped[selectedPap].forEach(entry => {
        const option = document.createElement("option");
        option.value =`${entry.class} ${entry.obj}`;
        option.textContent = `${entry.class} → ${entry.obj}`;
        objSelect.appendChild(option);
        });
    });

    // Trigger once at start
    if (papSelect.options.length > 0) {
        papSelect.dispatchEvent(new Event("change"));
